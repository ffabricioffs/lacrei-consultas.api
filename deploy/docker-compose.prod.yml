# Stack de UM ambiente (staging ou produção) na EC2.
#
# Cada ambiente roda como um projeto Docker Compose próprio, nomeado pelo
# diretório (/opt/lacrei/staging -> projeto "staging"), com:
#   - banco PostgreSQL e volume de dados exclusivos (<projeto>_pgdata);
#   - rede interna exclusiva sem saída para a internet (<projeto>_backend);
#   - .env exclusivo com os segredos do ambiente (permissão 600).
#
# A única rede compartilhada é "lacrei-edge", onde ficam apenas o proxy
# (deploy/edge) e os containers "web". O banco nunca entra nessa rede.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${IMAGE_NAME:?defina IMAGE_NAME}:${IMAGE_TAG:?defina IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_VERSION: ${IMAGE_TAG}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend: {}
      edge:
        # O proxy encaminha <host do ambiente> -> web-<ambiente>:8000
        aliases:
          - web-${APP_ENV:?defina APP_ENV (staging ou production)}
    logging: *default-logging

volumes:
  pgdata:

networks:
  backend:
    internal: true
  edge:
    name: lacrei-edge
    external: true
