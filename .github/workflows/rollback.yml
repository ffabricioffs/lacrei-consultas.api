name: Rollback

# Rollback manual: Actions > Rollback > Run workflow.
# Sem tag informada, volta para a versão anterior registrada no servidor (.previous_tag).
# Usa o mesmo workflow de deploy (SSH temporário via OIDC + smoke tests).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: "Tag da imagem (ex.: sha-1a2b3c4). Vazio = versão anterior"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validar:
    name: Validar parâmetros
    runs-on: ubuntu-latest
    steps:
      - name: Validar tag informada
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_TAG" ] && ! [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "Tag inválida: use o formato sha-xxxxxxx"; exit 1
          fi

  rollback:
    name: Rollback
    needs: validar
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_name: ghcr.io/${{ github.repository }}
      image_tag: ${{ inputs.image_tag }}
      action: rollback
    secrets: inherit
