name: CI/CD

# Pull requests: lint + testes (com cobertura) + build da imagem (sem publicar).
# Push na main:  lint → testes → build/push → deploy staging (+ smoke tests)
#                → [aprovação manual] → deploy produção (+ smoke tests + relatório de segregação).
#
# Produção depende EXPLICITAMENTE do sucesso do deploy de staging: se o staging
# falhar (inclusive nos smoke tests), o job de produção não é executado.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.3"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Poetry e dependências de desenvolvimento
        run: |
          pip install "poetry==${POETRY_VERSION}"
          poetry install --only dev --no-root

      - name: Ruff (lint + regras de segurança)
        run: poetry run ruff check --output-format=github .

      - name: Ruff (formatação)
        run: poetry run ruff format --check .

      - name: Resumo
        run: |
          {
            echo "## Lint"
            echo
            echo "✅ \`ruff check\` (pycodestyle, pyflakes, isort, bugbear, bandit, django) e \`ruff format --check\` sem apontamentos — $(poetry run ruff --version)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  test:
    name: Testes e cobertura
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lacrei
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei -d lacrei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lacrei:lacrei@localhost:5432/lacrei
      DJANGO_SECRET_KEY: ci-somente-para-testes-chave-com-mais-de-32-bytes
      ASAAS_MOCK: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache do Poetry
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}

      - name: Instalar dependências
        run: |
          pip install "poetry==${POETRY_VERSION}"
          poetry install --no-root

      - name: Verificar migrações pendentes
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Checagens do Django (incluindo de deploy)
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-chave-longa-somente-para-o-check-de-deploy-0123456789abcdef
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
        run: poetry run python manage.py check --deploy --fail-level ERROR

      - name: Rodar testes (APITestCase) com cobertura
        run: |
          poetry run coverage run manage.py test --verbosity 2 2>&1 | tee test-output.txt
          poetry run coverage report
          poetry run coverage xml

      - name: Resumo dos testes e da cobertura
        if: always()
        run: |
          {
            echo "## Testes (APITestCase + PostgreSQL 16)"
            echo
            echo '```'
            grep -E '^(Ran [0-9]+ tests|OK|FAILED)' test-output.txt || true
            echo '```'
            echo
            echo "### Cobertura"
            echo
            poetry run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testes-e-cobertura
          path: |
            test-output.txt
            coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build:
    name: Build da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test da imagem (Django carrega e não roda como root)
        run: |
          IMAGE="${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}"
          docker run --rm "$IMAGE" python manage.py check
          test "$(docker run --rm "$IMAGE" id -u)" != "0"

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}"

      - name: Resumo
        run: |
          IMAGE="${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}"
          TAMANHO="$(docker image inspect -f '{{.Size}}' "$IMAGE" | awk '{printf "%.0f MB", $1/1024/1024}')"
          {
            echo "## Build"
            echo
            echo "| Imagem | Tamanho | Usuário | Publicada |"
            echo "|---|---|---|---|"
            echo "| \`${IMAGE}\` | ${TAMANHO} | $(docker run --rm "$IMAGE" whoami) (não root) | ${{ github.event_name != 'pull_request' && 'sim (GHCR)' || 'não (pull request)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Staging
    needs: build
    # Só faz deploy depois que a AWS estiver configurada (variável de repositório DEPLOY_ENABLED=true).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_name: ${{ needs.build.outputs.image_name }}
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  deploy-production:
    name: Produção
    needs: [build, deploy-staging]
    # Produção só segue se o deploy de staging (incluindo smoke tests) terminou com sucesso.
    # A aprovação manual vem do Environment "production" (Required reviewers).
    if: needs.deploy-staging.result == 'success'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_name: ${{ needs.build.outputs.image_name }}
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
